name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run unit tests & typecheck
        run: |
          npx tsx --test src/core/protocols.test.ts src/core/pluginEngine.test.ts
          npm run lint

      - name: Build Windows Installer & Portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm run build
          npx electron-builder --win --config electron-builder.yml -c.extraMetadata.author=SerialPulse -c.extraMetadata.description="SerialPulse Workbench"

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SerialPulse-Windows-x64
          path: |
            release/*.exe
          if-no-files-found: error
